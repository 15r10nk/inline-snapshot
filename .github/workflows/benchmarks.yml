name: Benchmark smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
      with:
        python-version: '3.12'
    - run: uv run --frozen --group benchmark asv machine --yes
    - run: uv run --frozen --group benchmark asv check --python=same
    - run: uv run --frozen --group benchmark asv run --python=same --quick --show-stderr --dry-run

  compare:
    if: github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: '3.12'
    - name: Record compared revisions
      run: |
        git fetch --no-tags origin "$BASE_SHA"
        mkdir -p benchmark-results
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        metadata = {
            "base_sha": os.environ["BASE_SHA"],
            "pr_sha": os.environ["PR_SHA"],
            "pr_number": int(os.environ["PR_NUMBER"]),
        }
        Path("benchmark-results/metadata.json").write_text(json.dumps(metadata))
        Path("benchmark-commits.txt").write_text(
            metadata["base_sha"] + "\n" + metadata["pr_sha"] + "\n"
        )
        PY
    - run: uv run --frozen --group benchmark asv machine --yes
    # asv run fails on benchmark errors, but does not gate on performance changes.
    # Both revisions use the PR's suite and run sequentially on this same runner.
    - name: Measure base and PR
      run: >-
        uv run --frozen --group benchmark asv run HASHFILE:benchmark-commits.txt
        --record-samples --interleave-rounds --show-stderr --no-pull
    - name: Collect results
      if: always()
      run: |
        if [ -d .asv/results ]; then
          mkdir -p benchmark-results
          cp -R .asv/results/. benchmark-results/
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: benchmark-results
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 30
