name: Benchmarks

on: workflow_dispatch

permissions:
  contents: read

jobs:
  aa-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup
      with:
        python-version: '3.12'
    - name: Measure identical code in ABBA order
      env:
        PYTHONHASHSEED: '0'
      run: uv run --frozen --group benchmark python .github/scripts/benchmark_aa.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmark-aa-results
        path: aa-results/
