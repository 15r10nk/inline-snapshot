name: Benchmarks

on: pull_request

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        python-version: '3.12'
    - name: Benchmark base and PR
      run: |
        git fetch --no-tags origin "$BASE_SHA"
        printf '%s\n' "$BASE_SHA" "$PR_SHA" > commits.txt
        uv run --frozen --group benchmark asv machine --yes
        uv run --frozen --group benchmark asv run HASHFILE:commits.txt --record-samples --interleave-rounds --show-stderr --no-pull
    - name: Compare results
      # Use the API because the CLI exits with an error on regressions.
      run: |
        uv run --no-project --python 3.12 \
          --with 'asv-spyglass @ git+https://github.com/airspeed-velocity/asv_spyglass.git@810ba45dbebc293c1a36f442bda4b4a9bc997695' \
          python -c 'import sys; from asv_spyglass.compare import do_compare; print(do_compare(*sys.argv[1:], label_before="base", label_after="pr")[0])' \
          .asv/results/*/"${BASE_SHA:0:8}"*.json .asv/results/*/"${PR_SHA:0:8}"*.json .asv/results/benchmarks.json > .asv/results/comparison.txt
        echo "base_sha=$BASE_SHA" > .asv/results/metadata.txt
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results
        path: .asv/results/
