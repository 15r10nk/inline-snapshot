name: Benchmark PR report

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: benchmark-results
        path: results
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}
    - uses: HaoZeke/asv-perch@3910616093eb463672fec90a2011ff71bfdff071
      with:
        github-token: ${{ github.token }}
        comparison-text-file: results/comparison.txt
        metadata-file: results/metadata.txt
        pr-sha: ${{ github.event.workflow_run.head_sha }}
        regression-threshold: '1.1'
        auto-draft-on-regression: 'false'
